<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/> <!-- Vibrant Pitch Green -->
      <stop offset="100%" stop-color="#00B0FF"/> <!-- Data Tech Blue -->
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCFF00"/> <!-- Tennis Yellow/Lime -->
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- LOGO MARK (Icon) -->
  <g transform="translate(25, 20)">
    <!-- Outer Shield / Data Circle Base -->
    <circle cx="40" cy="40" r="36" fill="none" stroke="url(#primaryGrad)" stroke-width="3" opacity="0.3"/>
    
    <!-- Data Bars (Integrated into emblem) -->
    <rect x="22" y="42" width="6" height="18" rx="3" fill="url(#primaryGrad)"/>
    <rect x="32" y="32" width="6" height="28" rx="3" fill="url(#primaryGrad)"/>
    <rect x="42" y="24" width="6" height="36" rx="3" fill="url(#accentGrad)"/>
    <rect x="52" y="36" width="6" height="24" rx="3" fill="url(#primaryGrad)"/>

    <!-- Football (Hexagon line overlay trace) -->
    <path d="M 22 28 L 32 18 L 48 18 L 58 28" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Tennis Ball Seam (Swoosh curve) -->
    <path d="M 14 48 C 24 30, 56 30, 66 48" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Connection / Data Nodes -->
    <circle cx="32" cy="18" r="3" fill="#CCFF00"/>
    <circle cx="48" cy="18" r="3" fill="#00E676"/>
    <circle cx="42" cy="24" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- TYPOGRAPHY -->
  <g transform="translate(120, 72)">
    <!-- "Sports" - Bold & Clean -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="800" fill="currentColor" letter-spacing="0.5">Sports</text>
    
    <!-- "Data" - Accent Color & Tech Style -->
    <text x="142" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="800" fill="url(#primaryGrad)" letter-spacing="1">DATA</text>
    
    <!-- Subtitle / Tagline -->
    <text x="2" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="3.5">FOOTBALL &amp; TENNIS ANALYTICS</text>
  </g>
</svg>
