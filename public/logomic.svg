<svg xmlns="http://www.w3.org/2000/svg" width="200" height="400" viewBox="0 0 200 400">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b7e800"/>
      <stop offset="100%" stop-color="#73c900"/>
    </linearGradient>
  </defs>

  <!-- Transparent background -->
  <g transform="translate(100 105)">
    <!-- Sweeping data/sports arc -->
    <path d="M-70 42 C-45 70, 25 78, 73 38"
          fill="none" stroke="#06243b" stroke-width="10"
          stroke-linecap="round"/>

    <!-- Football -->
    <circle cx="-27" cy="-5" r="48" fill="#fff" stroke="#06243b" stroke-width="7"/>
    <path d="M-27-5 l-16-12 6-20 20-7 15 14-5 20z"
          fill="#06243b"/>
    <path d="M-43-17 l-22 10 M-37-37 l-12-20 M-2-10 l21 9 M-22 10 l-4 25 M-7-30 l14-21"
          fill="none" stroke="#06243b" stroke-width="5" stroke-linecap="round"/>

    <!-- Tennis ball -->
    <path d="M20-52 A48 48 0 0 1 66 25 A48 48 0 0 1 20 43 Z"
          fill="url(#green)"/>
    <path d="M35-46 C62-25 61 5 37 27"
          fill="none" stroke="#fff" stroke-width="5"/>

    <!-- Data bars -->
    <rect x="-3" y="20" width="12" height="27" rx="2" fill="#06243b"/>
    <rect x="13" y="7" width="12" height="40" rx="2" fill="#06243b"/>
    <rect x="29" y="-10" width="12" height="57" rx="2" fill="#06243b"/>
  </g>

  <!-- Wordmark -->
  <text x="100" y="205" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="32" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#06243b">Sports</tspan><tspan fill="#82d400">Data</tspan>
  </text>

  <!-- Tagline -->
  <text x="100" y="224" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="7.2" font-weight="600" letter-spacing="1.15"
        fill="#06243b">FOOTBALL &amp; TENNIS STATISTICS</text>
</svg>